<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="assets/icon.svg"><title>DUSTLINE モデルスタジオ</title><style>body{margin:0;background:#111e23;color:#e1e6d8;font:13px -apple-system,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh}header{position:absolute;left:18px;top:18px;max-width:85vw}h1{font-size:16px;letter-spacing:.2em}select,button,a{background:#152c32;color:#e3d1a8;border:1px solid #8c9d8b;padding:10px;display:inline-block;margin:3px;text-decoration:none}p{font-size:11px;color:#b5c1b7}#info{position:absolute;bottom:18px;left:18px;font-size:11px}</style><canvas id="c"></canvas><header><h1>DUSTLINE / MODEL STUDIO</h1><select id="model"><option value="ranger">RANGER / 作戦員</option><option value="scout">STRIDER / 軽歩行型</option><option value="heavy">BASTION / 重装甲型</option><option value="drone">KESTREL / ドローン</option><option value="loot">SALVAGE / 物資</option><option value="exit">EXTRACTION / ゲート</option></select><select id="motion"><option value="idle">待機</option><option value="walk">歩行</option><option value="run">走行</option><option value="reload">リロード</option><option value="fire">射撃</option><option value="hit">被弾</option><option value="death">死亡</option></select><button id="rotate">回転 ON</button><a href="index.html">ゲームへ</a><p>独自制作モデル / GLBはmodelsフォルダに収録。実行時はmodels.jsから生成。</p></header><div id="info"></div><script type="module">
import './engine.js?v=04';import './models.js?v=04';const T=DX3D.THREE,r=new DX3D.Renderer(document.querySelector('#c')),assets=DUSTMODELS.createAll(r);r.scene.fog=null;r.scene.background=new T.Color('#24373d');r.scene.getObjectByName('sky').visible=false;
const floor=new T.Mesh(new T.CircleGeometry(12,48),new T.MeshStandardMaterial({color:'#334245',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;r.scene.add(floor);
const key=new T.DirectionalLight('#e3e6da',2.5);key.position.set(4,5,7);r.scene.add(key);
let turning=true;document.querySelector('#rotate').onclick=e=>{turning=!turning;e.target.textContent='回転 '+(turning?'ON':'OFF')};let rot=.55;
function frame(t){requestAnimationFrame(frame);r.resize(innerWidth,innerHeight,1);const time=t/1000,type=document.querySelector('#model').value,motion=document.querySelector('#motion').value,size=type==='exit'?1.6:1;
 r.begin([3*size,2.2*size,4.1*size],[0,1.05*size,0],41,time);if(turning)rot+=.005;
 const obj=r.draw(assets[type],0,type==='drone'?1.6:0,0,rot);
 if(type==='ranger'){const p={move:motion==='walk'||motion==='run'?1:0,gait:time*(motion==='run'?11:7),sprinting:motion==='run',reloading:motion==='reload'?1.25-time%1.25:0};DUSTMODELS.poseRanger(obj,p,time,.02,motion==='fire'?.08*(1-time*7%1):0,motion==='hit'?.3*Math.sin(time*5):0,motion==='death');}
 else if(['scout','heavy','drone'].includes(type))DUSTMODELS.poseBot(obj,{type,phase:0,flash:motion==='fire'?.12:0},time);
 r.end();document.querySelector('#info').textContent=r.drawcalls+' draws · '+r.frameTriangles.toLocaleString()+' triangles';}
requestAnimationFrame(frame);
</script></html>
