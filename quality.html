<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUSTLINE v0.4 品質比較</title><style>body{background:#14262c;color:#e4e8df;font:15px -apple-system,sans-serif;margin:0}main{max-width:1200px;margin:auto;padding:30px 18px}h1{color:#dfc392}p{line-height:1.8;color:#bdcbc6}a{color:#dfc392}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;background:#20343a}img{width:100%;display:block}figcaption{padding:12px}.notice{border-left:3px solid #d9b67f;padding:12px 15px;background:#27393d}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><h1>DUSTLINE / v0.4</h1><p>人物の衣服・装備・人体形状、機械の装甲・駆動部、戦場の素材・窓・配管と照明を改修しました。対象目標はiPhone 13以上・iOS 27.0.1です。</p><p class="notice">実写相当の完成品質には未到達です。iPhone実機Safari・実機30fpsも未確認です。画像はChromiumのソフトウェアGPUで撮影しています。</p><p><a href="index.html">ゲームで確認する →</a>　<a href="preview.html">モデルスタジオ →</a>　<a href="CREDITS.html">素材クレジット</a></p><div class="grid"><figure><img src="assets/review/before-v03.png"><figcaption>改修前：v0.3 / 1366×768</figcaption></figure><figure><img src="assets/review/after-v04.png"><figcaption>改修後：v0.4 / 1100×700 / 標準画質</figcaption></figure><figure><img src="assets/review/ranger-v04.png"><figcaption>人物：CC0人体ベースと独自の装備。肌・布の変形は改善途中です。</figcaption></figure><figure><img src="assets/review/heavy-v04.png"><figcaption>機械：装甲・軸受・油圧部品・センサーを再構成。</figcaption></figure></div><p>画角と撮影条件は完全には一致せず、FPS比較用ではありません。iPhoneでは停止メニューからFPS表示をONにしてプレイ中の値を確認してください。</p></main></html>
